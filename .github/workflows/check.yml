name: Check public release

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run package:release
      - uses: actions/upload-artifact@v4
        with:
          name: CEBench-Live-1.0.0
          path: dist/releases/*
          if-no-files-found: error

