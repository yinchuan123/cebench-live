<title>CEBench-Live · 临床与健康证据交付基准 v0.1</title>
<style>
:root{color-scheme:light dark;--bg:#f7f6f2;--fg:#162a35;--sub:#53636c;--paper:#fff;--edge:#d8dfdf;--accent:#006c70;--soft:#e9f1f0;--warn:#8d4914;--bad:#a5232c;--shadow:0 2px 12px #153a4010}
@media(prefers-color-scheme:dark){:root{--bg:#122027;--fg:#e6edef;--sub:#b0c1c7;--paper:#192b33;--edge:#38505b;--accent:#81d5d0;--soft:#213d44;--warn:#f0b980;--bad:#ffb4b9;--shadow:none}}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.85 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}a{color:var(--accent);text-underline-offset:3px;overflow-wrap:anywhere}a:hover{text-decoration-thickness:2px}button,input,select{font:inherit;color:inherit}button,select,input{min-height:42px}button{border:1px solid var(--edge);border-radius:6px;padding:5px 14px;background:var(--paper);cursor:pointer}button:hover{background:var(--soft)}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}input,select{border:1px solid var(--edge);background:var(--paper);border-radius:5px;padding:4px 8px;max-width:100%}input[type=number]{width:94px}button.primary{background:var(--accent);color:var(--bg)}.top{padding:18px 5vw;border-bottom:1px solid var(--edge);display:flex;flex-wrap:wrap;align-items:center;gap:8px 22px;background:var(--paper)}.brand{font-weight:700;letter-spacing:.06em}.edition{font-size:13px;color:var(--sub)}.top-actions{margin-left:auto}.layout{display:grid;grid-template-columns:205px minmax(0,1fr);max-width:1390px;margin:auto;gap:30px;padding:24px 4vw 80px}.nav{position:sticky;top:16px;align-self:start;display:flex;flex-direction:column;gap:7px;font-size:14px}.nav a{text-decoration:none;padding:5px 10px;border-left:2px solid var(--edge)}.nav a:hover{border-left-color:var(--accent);background:var(--soft)}main{min-width:0;max-width:1020px}section{padding:10px 0 40px;scroll-margin-top:20px;border-bottom:1px solid var(--edge)}h1{font-size:clamp(30px,4.4vw,48px);letter-spacing:-.035em;line-height:1.3;margin:18px 0 24px;max-width:850px}h2{font-size:25px;line-height:1.5;margin:27px 0 18px}h3{font-size:19px;margin:26px 0 12px}p{margin:14px 0}.lead{font-size:20px;line-height:1.9;max-width:900px}.eyebrow{font-size:13px;letter-spacing:.08em;color:var(--accent);font-weight:650}.notice{padding:18px 22px;background:var(--soft);border-left:4px solid var(--accent);margin:26px 0}.table-wrap{overflow:auto;max-width:100%}table{width:100%;border-collapse:collapse;font-size:14px;line-height:1.75}th{text-align:left;color:var(--sub);font-weight:600;background:var(--soft)}th,td{border-bottom:1px solid var(--edge);padding:12px 10px;vertical-align:top}td:first-child{min-width:120px}li{margin:9px 0}ul,ol{padding-left:24px}.formula{font-family:ui-monospace,"SFMono-Regular","PingFang SC",monospace;font-size:14px;padding:14px 18px;border-left:3px solid var(--edge);overflow-wrap:anywhere}.track{display:grid;grid-template-columns:76px minmax(0,1fr);gap:5px 12px;padding:15px 0;border-bottom:1px solid var(--edge)}.track-id{color:var(--accent);font-size:22px;font-weight:600}.track strong{display:block}.tag{display:inline-block;background:var(--soft);color:var(--sub);border-radius:3px;font-size:12px;padding:1px 8px;margin-left:8px}.muted{color:var(--sub);font-size:14px}.source,.metric{border-bottom:1px solid var(--edge);padding:12px 0}summary{cursor:pointer;line-height:1.8;overflow-wrap:anywhere}summary strong{font-weight:600}details p{font-size:14px}.source-id{color:var(--sub);font-family:ui-monospace,monospace;font-size:12px;display:inline-block;min-width:65px}.source-meta{font-size:12px;color:var(--sub)}.source-target{scroll-margin-top:20px}.source-target:target{background:var(--soft)}.calc-toolbar{display:flex;flex-wrap:wrap;align-items:end;gap:14px;margin:16px 0}.field{display:flex;flex-direction:column;gap:5px;font-size:14px}.field select{min-width:145px}.calc-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(250px,.75fr);gap:24px}.score-table th,.score-table td{padding:9px 8px}.score-table td:first-child{min-width:130px}.score-table input{width:82px}.result{background:var(--paper);border:1px solid var(--edge);border-radius:8px;padding:20px;box-shadow:var(--shadow);align-self:start}.score-number{font-size:48px;line-height:1.3;font-weight:650;letter-spacing:-.04em;font-variant-numeric:tabular-nums}.result-label{color:var(--sub);font-size:14px}.result-line{padding:10px 0;border-bottom:1px solid var(--edge)}.status-text{font-weight:600}.bad{color:var(--bad)}.warn{color:var(--warn)}.gate-field{display:grid;grid-template-columns:1fr 115px;align-items:center;gap:10px;font-size:14px;padding:7px 0}.gate-field select{width:115px}.issues{font-size:13px;color:var(--sub);max-height:260px;overflow:auto;padding-left:19px}.calc-note{font-size:13px}.file-label{display:inline-block;position:relative;border:1px solid var(--edge);padding:5px 14px;border-radius:6px;background:var(--paper);cursor:pointer}.file-label input{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;min-height:0}.file-label:focus-within{outline:3px solid var(--accent)}.source-filter{width:min(100%,600px);margin:12px 0}.metric-facts{display:grid;grid-template-columns:100px 1fr;gap:8px 12px;font-size:14px;margin-top:12px}.metric-facts dt{color:var(--sub)}.metric-facts dd{margin:0;overflow-wrap:anywhere}footer{font-size:12px;color:var(--sub);padding:30px 4vw;border-top:1px solid var(--edge)}.print-only{display:none}[hidden]{display:none!important}
@media(max-width:980px){.layout{grid-template-columns:1fr;gap:0}.nav{position:static;flex-direction:row;flex-wrap:wrap;border-bottom:1px solid var(--edge);padding-bottom:14px;margin-bottom:14px}.nav a{border-left:0;padding:4px 6px}.calc-grid{grid-template-columns:1fr}h2{font-size:22px}.lead{font-size:18px}}
@media(max-width:520px){body{font-size:15px}.layout{padding:20px 18px 55px}.top{padding:15px 18px}.top-actions{margin-left:0}.nav{gap:5px;font-size:12px}.notice{padding:14px}.score-table input{width:72px}.score-table th,.score-table td{padding:8px 4px}.score-table td:first-child{min-width:0}.gate-field{grid-template-columns:minmax(0,1fr) 105px}.gate-field select{width:105px}.metric-facts{grid-template-columns:75px 1fr}.track{grid-template-columns:47px minmax(0,1fr)}.result{padding:16px}table{min-width:540px}.score-table{min-width:0}}
@media print{html{scroll-behavior:auto}body{background:#fff;color:#000;font-size:10pt}.top-actions,.nav,.calc-toolbar,.calc-grid,.source-filter{display:none!important}.layout{display:block;padding:0}main{max-width:none}section{break-inside:auto;padding-bottom:12pt}h1{font-size:25pt}h2{font-size:16pt;break-after:avoid}h3{font-size:12pt;break-after:avoid}table{font-size:9pt;min-width:0}tr{break-inside:avoid}.notice{background:#f5f5f5}a{color:#222}details>div,details>p,details>dl{display:block!important}.print-only{display:block}.source,.metric{break-inside:avoid}.table-wrap{overflow:visible}.source-meta{font-size:8pt}.eyebrow{color:#222}}
